{% extends "base.html" %}
{% block title %}Login - Osijek Housing{% endblock %}
{% block page_css %}
<link rel="stylesheet" href="/static/css/login.css">
{% endblock %}
{% block content %}
<section class="login">
    <h1>Login</h1>
    <p>Enter your faculty e-mail address to continue.</p>

    <form action="/login" method="post" class="login__form">
        <label for="email">Faculty e-mail address</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="name@ferit.hr" required>
        <button type="submit">Send authentication code</button>
    </form>
</section>
{% endblock %}
