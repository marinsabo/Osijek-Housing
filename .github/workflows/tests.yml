name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# Throwaway database that only exists while the job runs, so these aren't secrets.
env:
  POSTGRES_ADMIN_USER: ci
  POSTGRES_ADMIN_PASS: ci
  POSTGRES_HOST: localhost

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # On first start the image creates this database with PostGIS turned on
          POSTGRES_DB: osijek_test
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same as step 2 of "Running tests" in the README
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install --group dev

      - name: Test with pytest
        run: pytest
