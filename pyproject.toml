[project]
# Project name
name = "osijek-housing"

# Project version
version = "0.1.0"

# Supported Python version
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "GeoAlchemy2>=0.21.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = ["pytest>=9.2.0"]

[tool.setuptools.packages.find]
include = ["app*"]